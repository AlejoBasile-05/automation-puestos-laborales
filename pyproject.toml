[project]
name = "jobradar"
version = "0.1.0"
description = "Radar local de vacantes + CV a la medida para ATS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP
    "httpx>=0.27.0",
    # Base de datos
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Validación/esquemas
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    # Dashboard
    "streamlit>=1.37.0",
    # LLM
    "anthropic>=0.30.0",
    # Generación CV
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "python-docx>=1.1.0",
    # Verificación ATS
    "pdfplumber>=0.11.0",
    # Config
    "python-dotenv>=1.0.0",
    # CLI
    "typer>=0.12.0",
    # Utilidades
    "rich>=13.7.0",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]
ollama = [
    "ollama>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # allow assert and print in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "tests/fixtures",
    ".venv",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = ["pydantic.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.typer]
rich = true

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"