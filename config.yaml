# Configuración de JobRadar (versionable, sin secretos)
# Copia este archivo a config.yaml y ajusta según tus necesidades

search:
  keywords_include:
    - "analista financiero"
    - "financial analyst"
    - "fp&a"
    - "planeación financiera"
  keywords_exclude:
    - "senior director"
    - "practicante"
    - "pasante"
    - "jefe de departamento"
  locations:
    - "Monterrey"
    - "Nuevo León"
    - "Ciudad de México"
    - "Remote"
    - "Remoto"
  accept_remote: true
  max_age_days: 7

llm:
  provider: "nvidia"        # anthropic | ollama | nvidia
  model_scoring: "meta/llama-3.2-90b-vision-instruct"   # modelo gratuito de Nvidia NIM
  model_writing: "deepseek-ai/deepseek-v4.1-flash"   # mismo modelo para redacción (gratuito)
  max_jobs_per_run: 10
  # Opcional: precio por 1.000 tokens para estimar costo en el dashboard (0 = sin precio).
  price_input_per_1k_usd: 0.0
  price_output_per_1k_usd: 0.0

http:
  requests_per_second: 1
  timeout_seconds: 20

ats:
  min_required_coverage: 0.90
  max_keyword_repetitions: 3
  max_pages: 2
  font: "Arial"
  font_size_pt: 11
  date_format: "MMM YYYY"

discovery:
  provider: "serper"        # serper | brave | google_cse
  max_queries_per_run: 5
  cache_ttl_hours: 24

companies:
  # Slugs verificados con probe contra las APIs públicas (2026-11-02).
